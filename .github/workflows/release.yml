name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: vk-dpi-proxy-linux.zip
          - os: windows-latest
            artifact_name: vk-dpi-proxy-windows.exe
          - os: macos-latest
            artifact_name: vk-dpi-proxy-macos.zip

    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements-build.txt

      # Linux: 单文件可执行，打包为 zip 保留权限
      - name: Build Executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name "vk-dpi-proxy-linux" --add-data "proxy.pac:." --add-data "assets/icon.png:assets" dpi_proxy.py
          mkdir -p dist_final
          chmod +x dist/vk-dpi-proxy-linux
          cd dist && zip ../dist_final/vk-dpi-proxy-linux.zip vk-dpi-proxy-linux

      # macOS: 必须用 --onedir 生成 .app 包，再打包为 zip
      - name: Build Executable (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onedir --windowed --name "vk-dpi-proxy" --icon "assets/icon.icns" --add-data "proxy.pac:." --add-data "assets/icon.png:assets" dpi_proxy.py
          mkdir -p dist_final
          cd dist && zip -r ../dist_final/vk-dpi-proxy-macos.zip vk-dpi-proxy.app

      # Windows: 直接生成 .exe
      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --windowed --name "vk-dpi-proxy-windows" --icon "assets/icon.ico" --add-data "proxy.pac;." --add-data "assets/icon.png;assets" --add-data "assets/icon.ico;assets" dpi_proxy.py
          mkdir dist_final
          copy dist\vk-dpi-proxy-windows.exe dist_final\

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist_final/*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist_final/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
